[project]
name = "ytdigest"
version = "0.1.0"
description = "Transcribe and summarise YouTube finance videos, with verified numbers."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "structlog>=24.1",
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opencc-python-reimplemented>=0.1.7",
]
# Note: no market-data library. Prices come from one Yahoo chart
# endpoint called directly (src/ytdigest/prices.py) — yfinance was
# tried and removed, since it wrapped the same URL and added a
# dependency for nothing.

[project.optional-dependencies]
# Kept separate so `ytdigest status` / `doctor` work on a machine without MLX.
asr = [
    "mlx>=0.21",
    "mlx-audio>=0.2",     # provides Qwen3-ASR; mlx-lm alone cannot load it
    "numpy>=1.26",
    "soundfile>=0.12",
]
# Speaker identification. Captions have no diarization, so on a multi-host show
# every name in a summary was a guess without this. Kept optional because it
# pulls torch (~2 GB) and the pipeline degrades honestly without it: no
# voiceprints means no attribution, rather than a wrong one.
voice = [
    "torch>=2.4",
    "speechbrain>=1.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pyflakes>=3.2",
]

[project.scripts]
ytdigest = "ytdigest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdigest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
