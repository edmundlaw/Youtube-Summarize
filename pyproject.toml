[project]
name = "ytdigest"
version = "0.1.0"
description = "Transcribe and summarise YouTube finance videos, with verified numbers."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "structlog>=24.1",
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
# Kept separate so `ytdigest status` / `doctor` work on a machine without MLX.
asr = [
    "mlx>=0.21",
    "mlx-lm>=0.20",
    "numpy>=1.26",
    "soundfile>=0.12",
    "onnxruntime>=1.19",  # silero-vad
]
dev = [
    "pytest>=8.0",
    "pyflakes>=3.2",
]

[project.scripts]
ytdigest = "ytdigest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdigest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
