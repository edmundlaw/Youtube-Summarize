# ytdigest configuration. Secrets live in .env (chmod 600), never here.

[paths]
# Relative paths resolve against the repo root.
data_dir = "data"
out_dir  = "out"

[runner]
# Per-stage wall-clock timeout in seconds. A hung yt-dlp or runaway decode
# must not block the queue forever.
timeout_fetch_s      = 900
timeout_transcribe_s = 7200
timeout_normalize_s  = 300
# Must exceed (chunks + 1) x the per-call timeout in summarize.py (300s),
# or a map-reduce run is killed mid-flight and re-runs at full cost.
timeout_summarize_s  = 3600
timeout_publish_s     = 120
max_attempts         = 3
# Oldest-first, and never more than this many videos per invocation.
max_videos_per_run   = 12

[discover]
# Ignore anything published before this many days ago on first sync of a new
# channel, so adding a channel does not enqueue its entire back catalogue.
backfill_days = 7

[asr]
engine    = "qwen3"                                  # qwen3 | whisper | subtitles
model_id  = "mlx-community/Qwen3-ASR-1.7B-8bit"
# Chunking (ARCHITECTURE §8)
chunk_target_s     = 25.0
chunk_max_s        = 30.0
chunk_overlap_s    = 1.5
min_silence_ms     = 300
# Segments below this confidence are rendered with a warning marker in output.
low_confidence     = 0.55
# Prefer human-uploaded subtitles over ASR when available (free and exact).
prefer_manual_subs = true
# Delete the wav after a successful transcribe.
keep_audio         = false

[voice]
# Speaker identification. Captions carry no speaker labels, so on a multi-host
# show any name in a summary was a guess until this existed.
enabled   = true
# Calibrated on this corpus (see voice.py): 0.60 accepts 82% of true-speaker
# audio and 0% of a different host's. Raise it to attribute less but more
# safely; a missed attribution costs a data point, a wrong one corrupts a
# person's track record.
threshold = 0.60
# Best match must beat the runner-up by this much, else the segment is treated
# as cross-talk and left unattributed.
margin    = 0.08
# Audio is downloaded per video, embedded, and deleted. It is ~570 MB for a
# 2.5-hour show against ~36 KB of transcript, and is useless once embedded.
keep_audio = false

[summarize]
provider       = "deepseek"
model          = "deepseek-v4-flash"
escalate_model = "deepseek-v4-pro"   # used for the validator retry pass
base_url       = "https://api.deepseek.com"
# Informational only — summarize.PROMPT_VERSION is authoritative and is
# what gets recorded in each summary's frontmatter lineage.
prompt_version = "v2"
# Reasoning tokens count against this budget on deepseek-v4-*, and they
# dominate it: a trivial 7-character answer measured 221 reasoning tokens
# against 227 total. A budget sized for the answer alone returns a fragment.
#
# 12000 truncated the v3 prompt's output to 107 characters, which surfaced as
# "unterminated string" from the JSON parser rather than as truncation. Raising
# it was only safe once requests were streamed: buffered, the longer generation
# sat silent on the socket and DeepSeek cut it on all three attempts.
max_tokens     = 16000
# Above this many estimated TOKENS (not characters), use map-reduce.
# A 2.5-hour Cantonese show is ~43k tokens, so it splits into 3 chunks.
map_reduce_threshold_tokens = 40000
chunk_tokens                = 20000

[publish]
# Only notify about videos published within this many days. A digest is a
# notification, and one about last December's episode is noise — backfilling a
# back catalogue puts hundreds of old videos through the same pipeline as
# today's upload. Markdown is always written; only the Telegram message is
# suppressed. 0 disables the check and notifies for everything.
notify_within_days = 3
# Telegram credentials come from .env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
telegram = true
# Post a digest even when nothing new was produced (so silence is unambiguous).
notify_on_empty = false
# Warn if the oldest pending item is older than this.
stale_queue_hours = 48
