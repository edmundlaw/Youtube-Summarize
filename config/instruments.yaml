# Spoken name -> normalised symbol.
#
# Cantonese finance uses nicknames heavily and each host has their own. The
# normalised symbol is what lets a view join to price data; the alias list is
# what lets a transcript reach it. Add freely — an unmapped view is still
# stored, it just cannot be backtested until the mapping exists.
#
# Symbols follow the convention your market-data source uses:
#   HK equity  0700.HK      US equity  NVDA
#   index      ^HSI         FX         USDJPY
#   commodity  CL=F         crypto     BTC-USD

instruments:
  "0700.HK":
    asset_class: equity
    display_name: Tencent
    currency: HKD
    aliases: [騰訊, 騰迅, 鵝廠, tencent, Tencent]
  "0005.HK":
    asset_class: equity
    display_name: HSBC
    currency: HKD
    aliases: [滙豐, 匯豐, 大笨象, HSBC]
  "2388.HK":
    asset_class: equity
    display_name: BOC Hong Kong
    currency: HKD
    aliases: [中銀香港, 中銀]
  "9988.HK":
    asset_class: equity
    display_name: Alibaba
    currency: HKD
    aliases: [阿里, 阿里巴巴, BABA]
  "3690.HK":
    asset_class: equity
    display_name: Meituan
    currency: HKD
    aliases: [美團, "3690"]
  "2888.HK":
    asset_class: equity
    display_name: Standard Chartered
    currency: HKD
    aliases: [渣打, 渣打銀行]
  "1810.HK":
    asset_class: equity
    display_name: Xiaomi
    currency: HKD
    aliases: [小米]

  "^HSI":
    asset_class: index
    display_name: Hang Seng Index
    currency: HKD
    aliases: [恒指, 恆指, 恒生指數, 恆生指數, 港股, HSI]
  "^HSCE":
    asset_class: index
    display_name: HSCEI
    currency: HKD
    aliases: [國指, 企業指數, HSCEI]
  "^DJI":
    asset_class: index
    display_name: Dow Jones
    currency: USD
    aliases: [道指, 道瓊斯]
  "^IXIC":
    asset_class: index
    display_name: Nasdaq
    currency: USD
    aliases: [納指, 那斯達克, 納斯達克]
  "^GSPC":
    asset_class: index
    display_name: S&P 500
    currency: USD
    aliases: [標普, 標普500, S&P, 美股, 美國股市]
  "^SOX":
    asset_class: index
    display_name: Philadelphia Semiconductor
    currency: USD
    aliases: [費半, 費城半導體]
  "^N225":
    asset_class: index
    display_name: Nikkei 225
    currency: JPY
    aliases: [日經, 日经, 日經指數, 日本股市, Nikkei]

  GOOGL:
    asset_class: equity
    display_name: Alphabet
    currency: USD
    aliases: [Alphabet, Google, 谷歌]
  NVDA:
    asset_class: equity
    display_name: NVIDIA
    currency: USD
    aliases: [英偉達, 輝達, NVIDIA, Nvidia, nvidia]
  TSLA:
