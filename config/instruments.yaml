    currency: KRW
    aliases: [三星, 三星電子, Samsung]

  US10Y:
    asset_class: rate
    display_name: US 10-year Treasury yield
    currency: USD
    aliases: [十年債息, 10年債息, 美債息, 十年期債息, 美債, 美國債息, 債息]
