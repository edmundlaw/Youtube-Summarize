  USDJPY:
    asset_class: fx
    display_name: USD/JPY
    currency: JPY
    aliases: [日圓, 日元, 美元兌日圓, 美元兌日元, USDJPY]
  USDCNY:
    asset_class: fx
    display_name: USD/CNY
    currency: CNY
    aliases: [人民幣, 人幣, 美元兌人民幣]
  DXY:
    asset_class: fx
    display_name: Dollar Index
    currency: USD
    aliases: [美匯, 美滙, 美匯指數, 美元指數]

  "CL=F":
    asset_class: commodity
    display_name: WTI Crude
    currency: USD
    aliases: [油價, 原油, WTI, 紐約油, 油, 石油]
  "BZ=F":
    asset_class: commodity
    display_name: Brent Crude
    currency: USD
    aliases: [布油, 布蘭特]
  XAUUSD:
    asset_class: commodity
    display_name: Gold
    currency: USD
    # 黄 is the simplified form of 黃; both appear because the caption track
    # switches script mid-video. Bare 金 is deliberately NOT an alias — it is a
    # substring of 基金 (fund), 資金 (capital) and 美金 (USD), and substring
    # matching would silently attach those views to gold.
    aliases: [金價, 黃金, 黄金, 個金, gold, Gold]

  BTC-USD:
    asset_class: crypto
    display_name: Bitcoin
    currency: USD
    aliases: [比特幣, BTC, 比特]

  "^KS11":
    asset_class: index
    display_name: KOSPI
    currency: KRW
    aliases: [韓股, 韓國股市, 韓國股票, 南韓股市, KOSPI]
